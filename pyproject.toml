# Python tooling config for the Corpus scientific core.
# The Electron app is configured in package.json; this file covers pytest and ruff.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "training"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:corpus.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["node_modules", "dist", "data", "runs", "reports", "squashfs-root",
           # The Colab notebook is authored and run in Colab; leave its cells alone.
           "training/colab_train_yolo_seg.ipynb"]

[tool.ruff.lint]
# Correctness-focused: pyflakes, a subset of pycodestyle, bugbear, comprehensions,
# isort. Style opinions are left alone so the existing code is not churned.
select = ["E4", "E7", "E9", "F", "B", "C4", "I"]
ignore = [
    "B008",  # function call in default argument -- not used here, keeps noise down
    "E741",  # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Legacy pipeline modules, pending migration into `corpus/` (Workstream B1).
# They are still checked for real defects (F, E4/E7/E9); the rules below would
# require rewriting working code, so they are deferred rather than silenced
# repo-wide. Remove an entry as each module is migrated.
"training/*" = ["B007", "B023", "B904", "B905", "C401", "C414", "F841"]
"corpus_pipeline/*" = ["B007", "B023", "B904", "B905", "C401", "C414", "F841"]
# Standalone legacy batch script, kept for reference and not used by the app.
"Diameter-Measurement.py" = ["B007", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["corpus"]
